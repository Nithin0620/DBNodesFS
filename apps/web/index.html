<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBNodesFS — Hallmark Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --c-primary:    #0f0f0e;
        --c-secondary:  #8e8e88;
        --c-tertiary:   #fc4c02;
        --c-neutral:    #fafaf9;
        --c-surface:    #ffffff;
        --c-on-surface: #0f0f0e;
        --c-error:      #c0392b;
        --c-border:     #e5e2dc;

        --f-serif: 'Newsreader', Georgia, serif;
        --f-sans:  'Geist', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --f-mono:  'Geist Mono', 'Courier New', monospace;

        --r-none: 0px;
        --r-sm:   4px;
        --r-md:   8px;
        --r-lg:   17px;
        --r-xl:   24px;
        --r-full: 9999px;

        --s-xs: 8px;
        --s-sm: 16px;
        --s-md: 36px;
        --s-lg: 64px;
        --s-xl: 128px;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--c-neutral);
        color: var(--c-on-surface);
        font-family: var(--f-sans);
        font-size: 16px;
        line-height: 24px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: rgba(252, 76, 2, 0.15);
        color: var(--c-primary);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
